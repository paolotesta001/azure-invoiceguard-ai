name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard
          POSTGRES_DB: invoiceguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoiceguard" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      INVOICEGUARD_TEST_DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard@localhost:5432/invoiceguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -rs
      - name: synthetic data is up to date
        run: |
          PYTHONPATH=src:. python scripts/generate_synthetic_data.py --seed 42 --out data
          git diff --exit-code -- data
